<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Add your custom favicon here -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Your Name - Full Stack Developer & Creative Problem Solver</title>
    <meta name="title" content="Your Name - Full Stack Developer & Creative Problem Solver" />
    <meta name="description" content="Portfolio of a passionate full-stack developer specializing in React, Three.js, and modern web technologies. Creating exceptional digital experiences." />
    <meta name="keywords" content="Full Stack Developer, Web Developer, React, Three.js, Portfolio, Frontend, Backend, UI/UX" />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />

    <!-- Language Alternatives -->
    <link rel="alternate" hreflang="en" href="/" />
    <link rel="alternate" hreflang="nl" href="/?lang=nl" />
    <link rel="alternate" hreflang="x-default" href="/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourportfolio.com/" />
    <meta property="og:title" content="Your Name - Full Stack Developer & Creative Problem Solver" />
    <meta property="og:description" content="Portfolio of a passionate full-stack developer specializing in React, Three.js, and modern web technologies." />
    <meta property="og:image" content="https://yourportfolio.com/og-image.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="nl_NL" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourportfolio.com/" />
    <meta property="twitter:title" content="Your Name - Full Stack Developer & Creative Problem Solver" />
    <meta property="twitter:description" content="Portfolio of a passionate full-stack developer specializing in React, Three.js, and modern web technologies." />
    <meta property="twitter:image" content="https://yourportfolio.com/twitter-image.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#1A0B2E" />
    <meta name="msapplication-navbutton-color" content="#1A0B2E" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#1A0B2E" />

    <!-- Preconnect to Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Your Name",
      "url": "https://yourportfolio.com",
      "jobTitle": "Full Stack Developer",
      "description": "Passionate full-stack developer specializing in creating exceptional digital experiences",
      "sameAs": [
        "https://github.com/yourusername",
        "https://linkedin.com/in/yourusername",
        "https://twitter.com/yourusername"
      ],
      "image": "https://yourportfolio.com/profile.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "NL"
      }
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript in your browser to view this portfolio.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
